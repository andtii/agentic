packages:
  - packages/*
  - apps/*

onlyBuiltDependencies:
  - esbuild
  - workerd

# Single source of truth for every sigx-estate version. Core is pinned to ONE
# minor (`^0.15.0`): @sigx/reactivity keeps reactive state in module-local
# variables, so a second physical copy silently splits core's singletons.
# `sync:core` rewrites the core entries; the sibling entries are bumped by hand.
catalog:
  "@sigx/cache": ^0.15.0
  "@sigx/cloudflare": ^0.15.0
  "@sigx/reactivity": ^0.15.0
  "@sigx/runtime-core": ^0.15.0
  "@sigx/runtime-dom": ^0.15.0
  "@sigx/serialize": ^0.15.0
  "@sigx/server": ^0.15.0
  "@sigx/server-renderer": ^0.15.0
  "@sigx/vite": ^0.15.0
  "sigx": ^0.15.0
  # siblings (not core): bump by hand
  "@sigx/actors": ^0.9.2
  "@sigx/actors-cloudflare": ^0.9.2
  "@sigx/actors-ws": ^0.9.2
  "@sigx/router": ^0.12.1
  "@sigx/store": ^0.13.0
  "@sigx/markdown": ^0.2.0
  "@sigx/zero": ^0.2.0-beta.1
  "@sigx/zero-kit": ^0.2.0-beta.1
  "@sigx/zero-daisyui": ^0.2.0-beta.1
  # @sigx/ai* — published as 0.1.0 before feature work starts (signalxjs/ai#15)
  "@sigx/ai": ^0.1.0
  "@sigx/ai-agent": ^0.1.0
  "@sigx/ai-agent-node": ^0.1.0
  "@sigx/ai-agent-claude-code": ^0.1.0
  "@sigx/ai-anthropic": ^0.1.0
