name: Desktop

# The Tauri shell (apps/desktop, #844): format, lint and unit tests of the
# Rust side. Only runs when the shell changes, so the rest of the repo never
# needs a Rust toolchain. Installers and signing are desktop-release.yml (#848).

on:
  pull_request:
    branches: [main]
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Linux webview and tray libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
