name: CI

# One fast lane per PR, the full matrix on main (AGENTS.md → "Development workflow"):
#
# - PR: `changes` decides which lanes the diff can break (scripts/ci-changes.mjs);
#   static checks, the unit suite in 4 shards, workerd, e2e (phone + desktop)
#   and size run in parallel, each only when needed. `gate` is the ONE required
#   check — it passes when every lane that ran passed (skipped counts as passed).
# - push to main + nightly: every lane, plus Windows and Node 20, e2e at all
#   three widths and coverage. A red run opens (or comments on) a `main-red`
#   issue; fixing main comes before anything else (AGENTS.md).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; main runs never cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FULL: ${{ github.event_name != 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.lanes.outputs.code }}
      workers: ${{ steps.lanes.outputs.workers }}
      e2e: ${{ steps.lanes.outputs.e2e }}
      size: ${{ steps.lanes.outputs.size }}
      scripts: ${{ steps.lanes.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: lanes
        run: node scripts/ci-changes.mjs
        env:
          ALL: ${{ env.FULL == 'true' && '1' || '' }}

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm verify:catalog
      - run: pnpm typecheck
      - if: needs.changes.outputs.scripts == 'true'
        run: pnpm test:scripts

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm vitest run --shard=${{ matrix.shard }}/4

  # The Worker + ActorHost Durable Object inside workerd (Miniflare), then the
  # requirements §17 acceptance scenarios (docs/acceptance.md).
  workers:
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [test:workers, test:acceptance]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm --filter @agentic/web ${{ matrix.suite }}

  # Playwright against the dev server. PRs: phone-400 + desktop-1280 in two
  # shards; main: all three widths.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The app resolves workspace packages through their `exports`, so every
      # dist must exist before the dev server starts.
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @agentic/web exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2 ${{ env.FULL != 'true' && '--project=phone-400 --project=desktop-1280' || '' }}
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  size:
    needs: changes
    if: needs.changes.outputs.size == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm size

  # --- main and nightly only -------------------------------------------------

  compat:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node-version: '22'
          - os: ubuntu-latest
            node-version: '20'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - if: matrix.node-version == '22'
        run: pnpm --filter @agentic/web test:workers
      - if: matrix.node-version == '22'
        run: pnpm --filter @agentic/web test:acceptance

  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  # The one required check (scripts/apply-branch-protection.mjs).
  gate:
    if: always()
    needs: [changes, static, unit, workers, e2e, size]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every lane that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lanes: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a lane ended $r"; exit 1 ;; esac
          done

  main-red:
    if: failure() && github.event_name != 'pull_request'
    needs: [gate, compat, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Open or update the main-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="CI is red on \`main\` (${{ github.event_name }}, ${GITHUB_SHA::7}): $RUN — fix main before starting new work (AGENTS.md)."
          open=$(gh issue list --label main-red --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "main is red" --label main-red --body "$body"; fi
