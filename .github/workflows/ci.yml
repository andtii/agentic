name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['20', '22']
        include:
          - os: windows-latest
            node-version: '22'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Every core dep must flow through a single-minor catalog (one hoisted
      # copy). Cheap static check; fails fast before build/test.
      - name: Verify catalog
        run: pnpm verify:catalog

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # The Worker + ActorHost Durable Object inside workerd (Miniflare).
      # wrangler/miniflare need Node >= 22.
      - name: Workers tests
        if: matrix.node-version == '22'
        run: pnpm --filter @agentic/web test:workers

      # Requirements §17 as scripted scenarios (docs/acceptance.md): the
      # workerd half needs the pool above, the in-process half runs here too.
      - name: Acceptance suite
        if: matrix.node-version == '22'
        run: pnpm --filter @agentic/web test:acceptance

  # Playwright against the dev server at 400 / 1024 / 1280 px: the phone
  # regime, the tablet rails drop and the desktop flows (apps/web/e2e).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app resolves workspace packages through their `exports`, so every
      # dist must exist before the dev server starts.
      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @agentic/web exec playwright install --with-deps chromium

      - name: Playwright
        run: pnpm --filter @agentic/web test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
