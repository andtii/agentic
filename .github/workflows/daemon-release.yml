name: Daemon release

# Builds the daemon installer zip on every OS the one-line installers serve
# (apps/web/public/install.ps1, install.sh) and publishes them with a
# `manifest.json` (version, channel, commit, protocol, per-<os>-<arch> url +
# sha256 + bytes — apps/daemon/scripts/lib/manifest.mjs) the installers read:
#
# - a push to main updates the rolling `daemon-latest` pre-release — channel
#   `latest`, version `<package.json version>-main.<sha7>`;
# - a pushed tag `daemon-v<semver>` (or a manual run with the `tag` input)
#   creates the release `daemon-v<semver>` — channel `stable`, version <semver> —
#   and, unless the semver is a pre-release (`-rc.1`), copies its manifest to the
#   rolling `daemon-stable` pre-release, which is where the stable channel reads it.
#   Nothing depends on GitHub's "latest release" (release-drafter owns that for the app).
#
# Assets are named without a version (agentic-daemon-<os>-<arch>.zip, each with
# its `.sha256`); the version is in the manifest and inside the zip
# (`agentic-daemon --version`, stamped by apps/daemon/scripts/lib/stamp.mjs).
#
# The daemon zip carries no native runtime (#369): the three harness packages,
# harness-<runtime>-<version>-<os>-<arch>.zip (the runtime's native npm package at
# the version the lockfile pins — package.mjs --harness), are listed by the
# manifest under `harnesses[runtime]`, and the installers and the daemon install
# from them. They are named by version and uploaded once (#441): a main run
# packages only a harness whose zip for that version is not on daemon-latest yet
# (`manifest.mjs plan`), the manifest carries the others over from the previous
# manifest, and the zips no manifest uses any more are deleted (`manifest.mjs
# stale`). A tag release packages and uploads every harness itself.
# docs/runbook.md §5.1, §5.3.

on:
  push:
    branches: [main]
    tags: ['daemon-v*']
    paths:
      - 'apps/daemon/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/daemon-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag daemon-v<semver> to build from this ref (empty: update daemon-latest)'
        required: false
        default: ''

# main runs replace each other (only the newest build matters); a release run is never cancelled,
# and never cancels a main run — its own group per tag.
concurrency:
  group: ${{ inputs.tag && format('daemon-release-{0}', inputs.tag) || (github.ref_type == 'tag' && format('daemon-release-{0}', github.ref_name) || 'daemon-release') }}
  cancel-in-progress: ${{ !(inputs.tag || github.ref_type == 'tag') }}

permissions: {}

env:
  # The release tag, empty on a main run: read by scripts/lib/stamp.mjs (the build, package and manifest steps).
  AGENTIC_DAEMON_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  package:
    runs-on: ${{ matrix.os }}
    # Read daemon-latest's assets (which harness zips are already there).
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        run: node scripts/package.mjs --unversioned --sha256
        working-directory: apps/daemon

      # The version each harness would be packaged at, and which of them daemon-latest already has for this
      # platform (#441). A release packages them all. harness-versions.json travels to the publish job.
      - name: Which harnesses to package
        id: harnesses
        shell: bash
        working-directory: apps/daemon
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          node scripts/package.mjs --harness-versions > release/harness-versions.json
          cat release/harness-versions.json
          if [ -z "$AGENTIC_DAEMON_TAG" ]; then
            gh release view daemon-latest --json assets --jq '[.assets[].name]' > existing.json 2>/dev/null || echo '[]' > existing.json
          else
            echo '[]' > existing.json
          fi
          runtimes=$(node scripts/lib/manifest.mjs plan --versions release/harness-versions.json --existing existing.json)
          echo "to package: ${runtimes:-none}"
          echo "runtimes=$runtimes" >> "$GITHUB_OUTPUT"

      # One zip per harness runtime, each with its .sha256 and its .json (the zip's manifest.json, read by the manifest step).
      - name: Package the harnesses
        if: steps.harnesses.outputs.runtimes != ''
        shell: bash
        working-directory: apps/daemon
        run: |
          args=()
          for runtime in ${{ steps.harnesses.outputs.runtimes }}; do args+=(--harness "$runtime"); done
          node scripts/package.mjs --sha256 "${args[@]}"

      - name: Version
        run: node apps/daemon/bin/agentic-daemon.mjs --version

      - uses: actions/upload-artifact@v7
        with:
          name: agentic-daemon-${{ matrix.os }}
          path: |
            apps/daemon/release/agentic-daemon-*.zip
            apps/daemon/release/agentic-daemon-*.zip.sha256
            apps/daemon/release/harness-*.zip
            apps/daemon/release/harness-*.zip.sha256
            apps/daemon/release/harness-*.zip.json
            apps/daemon/release/harness-versions.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The manifest script and the stamp it reads (package.json, packages/core's protocol version).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            apps/daemon/package.json
            apps/daemon/scripts/lib
            packages/core/src/daemon.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: List
        run: ls -la release

      # Every zip against its sidecar before anything is published.
      - name: Check the hashes
        working-directory: release
        run: cat *.zip.sha256 | sha256sum -c -

      # What daemon-latest has now: its asset names and the manifest the last run uploaded, from which the
      # manifest step carries over the harnesses this run did not package (#441). A release starts from nothing.
      - name: Read daemon-latest
        run: |
          if [ -z "$AGENTIC_DAEMON_TAG" ]; then
            gh release view daemon-latest --json assets --jq '[.assets[].name]' > existing.json 2>/dev/null || echo '[]' > existing.json
            gh release download daemon-latest --pattern manifest.json --output previous.json 2>/dev/null || echo '{}' > previous.json
          else
            echo '[]' > existing.json
            echo '{}' > previous.json
          fi
          cat existing.json

      # The pre-release exists once; every run replaces its assets and moves the tag to this commit.
      - name: Upload to the daemon-latest pre-release
        if: env.AGENTIC_DAEMON_TAG == ''
        run: |
          notes="Rolling build of the machine daemon from main — what the one-line installers on the Pair page fetch (channel latest). Not a versioned release."
          if ! gh release view daemon-latest >/dev/null 2>&1; then
            gh release create daemon-latest --prerelease --title "Daemon (latest main)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload daemon-latest release/*.zip release/*.zip.sha256 --clobber
          gh release edit daemon-latest --notes "$notes Built from $GITHUB_SHA."

      # A release: notes from release-drafter's newest draft when there is one, else generated.
      - name: Create the release
        if: env.AGENTIC_DAEMON_TAG != ''
        run: |
          case "$AGENTIC_DAEMON_TAG" in daemon-v[0-9]*) ;; *) echo "::error::$AGENTIC_DAEMON_TAG is not daemon-v<semver>"; exit 1 ;; esac
          if gh release view "$AGENTIC_DAEMON_TAG" >/dev/null 2>&1; then
            echo "::error::release $AGENTIC_DAEMON_TAG already exists — delete it first to rebuild"
            exit 1
          fi
          draft=$(gh release list --limit 20 --json tagName,isDraft --jq '[.[] | select(.isDraft)][0].tagName // ""')
          if [ -n "$draft" ]; then
            gh release view "$draft" --json body --jq .body > notes.md
            set -- --notes-file notes.md
          else
            set -- --generate-notes
          fi
          # A semver pre-release (daemon-v0.2.0-rc.1) is a GitHub pre-release. Never --latest: GitHub's
          # "latest release" belongs to the app's release-drafter releases.
          # Tested on the semver alone: the tag's own `daemon-` prefix has a hyphen (daemon-v0.1.1 went out a pre-release).
          case "${AGENTIC_DAEMON_TAG#daemon-v}" in *-*) set -- "$@" --prerelease ;; *) set -- "$@" --latest=false ;; esac
          gh release create "$AGENTIC_DAEMON_TAG" --title "Daemon ${AGENTIC_DAEMON_TAG#daemon-v}" --target "$GITHUB_SHA" "$@" \
            release/*.zip release/*.zip.sha256

      # After the upload: the manifest names the uploaded assets, hashed from the sidecars (the harnesses' versions from
      # their .json), and every harness this run did not package from the previous manifest — the same version, still on
      # the release. A harness in neither fails the step.
      - name: Upload the manifest
        run: |
          tag=${AGENTIC_DAEMON_TAG:-daemon-latest}
          node apps/daemon/scripts/lib/manifest.mjs --dir release --tag "$tag" --repo "$GITHUB_REPOSITORY" --out manifest.json \
            --harness-versions release/harness-versions.json --previous previous.json --existing existing.json
          cat manifest.json
          gh release upload "$tag" manifest.json --clobber

      # The harness zips the new manifest no longer names (an older version, the unversioned names from before #441).
      - name: Delete the harness zips nothing uses
        if: env.AGENTIC_DAEMON_TAG == ''
        run: |
          node apps/daemon/scripts/lib/manifest.mjs stale --existing existing.json --manifest manifest.json > stale.txt
          while read -r name; do
            [ -n "$name" ] || continue
            echo "deleting $name"
            gh release delete-asset daemon-latest "$name" --yes
          done < stale.txt

      # The stable channel: the same manifest on the rolling daemon-stable pre-release (its asset urls
      # point at the versioned release). A semver pre-release (-rc.1) never moves it.
      - name: Move daemon-stable to this release
        if: env.AGENTIC_DAEMON_TAG != ''
        run: |
          # The semver alone decides: `contains(tag, '-')` matched the `daemon-` prefix and skipped daemon-v0.1.1.
          case "${AGENTIC_DAEMON_TAG#daemon-v}" in *-*) echo "a pre-release: daemon-stable stays where it is"; exit 0 ;; esac
          notes="The stable channel of the machine daemon: its manifest.json names the current stable release, ${AGENTIC_DAEMON_TAG} (https://github.com/${GITHUB_REPOSITORY}/releases/tag/${AGENTIC_DAEMON_TAG}). Not a release of its own."
          if ! gh release view daemon-stable >/dev/null 2>&1; then
            gh release create daemon-stable --prerelease --title "Daemon (stable)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload daemon-stable manifest.json --clobber
          gh release edit daemon-stable --notes "$notes"
